name: Public release acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/public-release-acceptance.yml"
      - "tools/validate_public_release.py"
      - "tools/validate_public_release_v030.py"
      - "tests/test_public_release_acceptance.py"
      - "tests/test_public_release_v030.py"
      - "docs/releases.md"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  openrtl-0-2-0:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install public simulation toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes verilator make
      - name: Validate public release and examples
        run: |
          python tools/validate_public_release.py \
            --output-directory build/public-release-acceptance \
            --with-verilator
      - name: Show bounded simulator diagnostics
        if: failure()
        run: |
          python --version
          verilator --version
          python - <<'PY'
          from pathlib import Path

          for path in sorted(Path("build").glob("**/run.log")):
              content = path.read_bytes()
              print(f"===== {path} ({len(content)} bytes; final 65536 bytes) =====")
              print(content[-65536:].decode("utf-8", errors="replace"))
          PY

  openrtl-0-3-0:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install public simulation toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes verilator make
      - name: Validate OpenRTL 0.3.0 public release and examples
        run: |
          python tools/validate_public_release_v030.py \
            --output-directory build/public-release-v0.3.0-acceptance \
            --with-verilator
      - name: Show bounded simulator diagnostics
        if: failure()
        run: |
          python --version
          verilator --version
          python - <<'PY'
          from pathlib import Path

          for path in sorted(Path("build").glob("**/run.log")):
              content = path.read_bytes()
              print(f"===== {path} ({len(content)} bytes; final 65536 bytes) =====")
              print(content[-65536:].decode("utf-8", errors="replace"))
          PY
